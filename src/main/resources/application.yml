spring:
  application:
    name: freyr-agent-control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freyr_agent_control_plane}
    username: ${DB_USERNAME:freyr}
    password: ${DB_PASSWORD:freyr}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
